[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mesa-self-construction"
version = "1.0.0"
description = "Construction automata in Conway's Game of Life (slow-salvo synthesis) and the canonical von Neumann 29-state automaton, built with Mesa."
readme = "README.md"
authors = [{ name = "dwan-ith" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mesa>=3.5.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.25.0",
]

[project.scripts]
mesa-self-construction = "app:app"

[tool.setuptools.package-data]
mesa_self_construction = ["data/*.table"]
